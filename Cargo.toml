[workspace]
members = ["crates/nexus-common", "crates/nexus-daemon", "crates/nexus-agent", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.87"

[workspace.dependencies]
anyhow = "1"
arboard = "3"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "input_capture"] }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
dashmap = "6"
futures-util = "0.3"
parking_lot = "0.12"
proptest = "1"
reis = { version = "0.5", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
